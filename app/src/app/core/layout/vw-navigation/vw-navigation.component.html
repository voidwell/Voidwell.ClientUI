<div class="vw-navigation">
  <mat-sidenav-container>
    <mat-sidenav [mode]="mobileQuery.matches ? 'over' : 'side'"
      [fixedInViewport]="mobileQuery.matches"
      [opened]="sidenavState"
      [ngClass]="{'snapped': !mobileQuery.matches}"
      (closedStart)="closed()">
      <mat-nav-list>
        <div class="navigation-close nav-margin pl-10 -mt-1.5">
          <button mat-icon-button (click)="closed()">
            <mat-icon fontSet="mdi" fontIcon="mdi-arrow-left"></mat-icon>
          </button>
        </div>
        <mat-tree [dataSource]="nestedDataSource" [treeControl]="nestedTreeControl" class="nav-list nav-margin pl-10 pt-4">
          <mat-nested-tree-node *matTreeNodeDef="let node" class="mb-8" matTreeNodeToggle>
            <ng-container *ngTemplateOutlet="navLink; context: { $implicit: node }"></ng-container>
          </mat-nested-tree-node>
          <mat-nested-tree-node *matTreeNodeDef="let node; when: hasNestedChild" class="mb-8">
            <div class="flex items-center mb-6">
              <ng-container *ngTemplateOutlet="navLink; context: { $implicit: node }"></ng-container>
              <button mat-icon-button matTreeNodeToggle class="md-icon-button ml-2 toggle-button">
                <mat-icon fontSet="mdi" [fontIcon]="nestedTreeControl.isExpanded(node) ? 'mdi-minus' : 'mdi-plus'"></mat-icon>
              </button>
            </div>
            <ul [class.nav-node-invisible]="!nestedTreeControl.isExpanded(node)">
              @if (node.platformPicker) {
                <vw-platform-picker class="nav-platform-picker"></vw-platform-picker>
              }
              <ng-container matTreeNodeOutlet></ng-container>
            </ul>
          </mat-nested-tree-node>
          <ng-template #navLink let-node>
            <a class="flex items-center"
              routerLink="{{node.url}}"
              routerLinkActive #rla="routerLinkActive"
              [class.active]="rla.isActive"
              [routerLinkActiveOptions]="{ exact: node.exact }">
              @if (node.icon) {
                <mat-icon fontSet="mdi" fontIcon="{{node.icon}}" class="sm-icon mr-2"></mat-icon>
              }
              {{node.name}}
            </a>
          </ng-template>
        </mat-tree>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content class="pt-4">
      <ng-content></ng-content>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
