<div class="vw-header px-11 py-8">
  <div class="flex items-center">
    <div class="logo flex items-center">
      <div class="inline-block pr-6">
        <button mat-icon-button class="menu-button md-icon-button" (click)="toggleNav()">
          <mat-icon fontSet="mdi" fontIcon="mdi-menu"></mat-icon>
        </button>
      </div>
      <a routerLink="/" class="logo-button inline-block text-center">
        <vw-logo></vw-logo>
      </a>
    </div>
    @if (searchService.isUsable()) {
      <div class="search-outlet text-center flex-grow mx-16"
        [ngClass]="{'focus': searchService.searchFocused() || searchService.control.dirty}">
        <form>
          <router-outlet name="search"></router-outlet>
        </form>
      </div>
    }
    <div class="flex items-center ml-auto">
      @if (searchService.isUsable()) {
        <button mat-icon-button class="search-button md-icon-button ml-auto mr-4" (click)="focusSearch($event)">
          <mat-icon fontSet="mdi" fontIcon="mdi-magnify"></mat-icon>
        </button>
      }
      <vw-profile ></vw-profile>
    </div>
  </div>
</div>
