<mat-card class="vw-character-vehicle-usage">
  <mat-card-title class="card-title">
    <span class="flex flex-wrap items-center gap-3">
      <span>Vehicle Usage</span>
      <vw-chips label="Seat" [options]="seatOptions" [value]="seat()" (choose)="seat.set($event)"></vw-chips>
    </span>
    <a class="view-all" routerLink="/ps2/player/{{player().id}}/vehicles">View All &rarr;</a>
  </mat-card-title>
  <mat-card-content>
    @if (vehicles()) {
      @if (vehicleTimes().length) {
        <planetside-player-stats-usage-donut [entries]="vehicleTimes()" [label]="'Vehicle usage as ' + seat()"></planetside-player-stats-usage-donut>
      } @else {
        <p class="empty">No time as {{ seat() }} yet.</p>
      }
    } @else {
      <vw-loader variant="lines" [rows]="5" [loading]="true"></vw-loader>
    }
  </mat-card-content>
</mat-card>
