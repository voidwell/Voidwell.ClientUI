<mat-card class="vw-character-class-usage">
  <mat-card-title class="card-title">
    <span>Class Usage</span>
    <a class="view-all" routerLink="/ps2/player/{{player().id}}/classes">View All &rarr;</a>
  </mat-card-title>
  <mat-card-content>
    @if (profiles()) {
    <div class="usage flex flex-wrap items-center gap-6">
      <svg class="donut flex-none" viewBox="0 0 160 160" role="img" aria-label="Class usage">
        <g transform="translate(80,80)">
          @for (slice of slices(); track slice.profileTypeId) {
            <path [attr.d]="slice.path" [attr.fill]="slice.color"></path>
          }
        </g>
        <text class="donut-caption" x="80" y="72" text-anchor="middle">Total Time</text>
        <text class="donut-total" x="80" y="98" text-anchor="middle">{{totalHours() | number: '1.0-0'}}h</text>
      </svg>
      <ul class="legend grow">
        @for (slice of slices(); track slice.profileTypeId) {
          <li class="flex items-center gap-3">
            <span class="dot" [style.background]="slice.color"></span>
            <span class="name grow">{{slice.name}}</span>
            <span class="percent">{{slice.percent | number: '1.1-1'}}%</span>
            <span class="hours">{{slice.hours | number: '1.0-0'}}h</span>
          </li>
        }
      </ul>
    </div>
    } @else {
      <vw-loader variant="lines" [rows]="5" [loading]="true"></vw-loader>
    }
  </mat-card-content>
</mat-card>
