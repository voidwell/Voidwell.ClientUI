@if (player(); as playerData) {
  <div class="voidwell-character-stats flex flex-col gap-4">
    <div class="card-grid flex flex-wrap gap-4">
      <planetside-player-stats-overview-card class="card flex-auto" [player]="playerData"></planetside-player-stats-overview-card>
      @if (playerData.outfit) {
        <planetside-player-stats-outfit-card class="card flex-auto" [player]="playerData"></planetside-player-stats-outfit-card>
      }
    </div>
    <div class="card-grid flex flex-wrap gap-4">
      <planetside-player-stats-siege-card class="siege-container card flex-auto" [captured]="playerData.lifetimeStats.facilityCaptureCount" [defended]="playerData.lifetimeStats.facilityDefendedCount"></planetside-player-stats-siege-card>
      <planetside-player-stats-kdr-card class="card flex-auto" [stats]="playerData.lifetimeStats"></planetside-player-stats-kdr-card>
      <planetside-player-stats-weapons-card class="card flex-auto" [stats]="playerData.lifetimeStats"></planetside-player-stats-weapons-card>
      <planetside-player-stats-ivi-card class="card flex-auto" [stats]="playerData.infantryStats"></planetside-player-stats-ivi-card>
    </div>
  </div>
} @else {
  <div class="voidwell-character-stats flex flex-col gap-4">
    <div class="card-grid flex flex-wrap gap-4">
      <vw-loader class="vw-character-overview card flex-auto basis-75" variant="panel" [loading]="true"></vw-loader>
      <vw-loader class="vw-character-outfit card flex-auto basis-75" variant="panel" [loading]="true"></vw-loader>
    </div>
    <div class="card-grid flex flex-wrap gap-4">
      @for (item of [0, 1, 2, 3]; track item) {
        <vw-loader class="card flex-auto basis-56 max-w-112" variant="panel" [loading]="true"></vw-loader>
      }
    </div>
  </div>
}
