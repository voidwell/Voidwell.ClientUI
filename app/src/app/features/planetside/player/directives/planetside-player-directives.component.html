<div class="content-container">
  <vw-loader [loading]="isLoading"></vw-loader>
  @if (errorMessage) {
    <vw-error-card></vw-error-card>
  }
  @if (!isLoading && !errorMessage) {
    <div class="directives">
      <mat-accordion>
        @for (category of outline.categories; track category) {
          <mat-expansion-panel>
            <mat-expansion-panel-header>{{category.name}}</mat-expansion-panel-header>
            <directive-tree-list [trees]="category.trees"></directive-tree-list>
          </mat-expansion-panel>
        }
      </mat-accordion>
    </div>
  }
</div>
