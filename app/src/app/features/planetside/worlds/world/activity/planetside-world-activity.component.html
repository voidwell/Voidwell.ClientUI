<vw-loader [loading]="!activity()"></vw-loader>
@if (activity(); as activity) {
  <div class="world-activity">
    <active-alerts-card [alerts]="alerts()"></active-alerts-card>
    <activity-population-card [data]="activity.historicalPopulations"></activity-population-card>
    <div class="grid grid-cols-1 gap-4 mb-4 lg:grid-cols-[repeat(2,minmax(0,1fr))]">
      <activity-factions-card [stats]="activity.stats"></activity-factions-card>
      <activity-classes-card [classes]="activity.classStats"></activity-classes-card>
    </div>
    <activity-players-card [players]="players()"></activity-players-card>
    <activity-outfits-card [outfits]="outfits()"></activity-outfits-card>
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-[repeat(2,minmax(0,1fr))]">
      <combat-weapons-card caption="last hour" [weapons]="activity.topWeapons"></combat-weapons-card>
      <combat-vehicles-card caption="last hour" [vehicles]="activity.topVehicles"></combat-vehicles-card>
    </div>
  </div>
}
