<div>
  <vw-loader variant="list" [loading]="isLoading"></vw-loader>
  @if (errorMessage) {
    <vw-error-card></vw-error-card>
  }
  @if (!isLoading && !errorMessage) {
    <div>
      @for (world of worlds | orderBy: 'name'; track world) {
        <world-card [world]="world"></world-card>
      }
    </div>
  }
</div>
