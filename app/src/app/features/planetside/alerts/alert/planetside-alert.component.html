<vw-loader [loading]="isLoading"></vw-loader>
@if (errorMessage) {
  <vw-error-card></vw-error-card>
}
@if (!isLoading && !errorMessage && event(); as alert) {
  <vw-breadcrumbs [crumbs]="breadcrumbs()"></vw-breadcrumbs>
  <combat-event-header
    [title]="alert.metagameEvent?.name ?? 'Alert'"
    [subtitle]="((alert.worldId | worldName) ?? '') + ' › ' + ((alert.zoneId | zoneName) ?? '')"
    [description]="alert.metagameEvent?.description ?? ''"
    [start]="start()"
    [end]="end()"
    [scores]="scores()"
    [startScores]="startScores()"
    [alarm]="true"
    [tabs]="tabs"></combat-event-header>
  <router-outlet></router-outlet>
}
