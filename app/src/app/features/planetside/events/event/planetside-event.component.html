<vw-loader [loading]="isLoading"></vw-loader>
@if (errorMessage) {
  <vw-error-card></vw-error-card>
}
@if (!isLoading && !errorMessage && event(); as activeEvent) {
  <vw-breadcrumbs [crumbs]="breadcrumbs()"></vw-breadcrumbs>
  <combat-event-header
    [title]="activeEvent.name"
    [subtitle]="((activeEvent.serverId | worldName) ?? '') + ' › ' + ((activeEvent.mapId | zoneName) ?? '')"
    [description]="activeEvent.description ?? ''"
    [start]="start()"
    [end]="end()"
    [scores]="scores()"
    [zoneId]="activeEvent.mapId"
    [tabs]="tabs"></combat-event-header>
  <router-outlet></router-outlet>
}
