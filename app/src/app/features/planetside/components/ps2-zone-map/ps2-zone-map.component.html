@if (isLoading) {
  <div class="map"></div>
}
@if (errorMessage) {
  <vw-error-card></vw-error-card>
}
@if (!isLoading && !errorMessage) {
  <div class="map" [class.overlay-hidden]="hideOverlay" leaflet [leafletOptions]="leafletOptions" [leafletFitBounds]="fitBounds" (leafletMapReady)="onMapReady($event)"></div>
}
