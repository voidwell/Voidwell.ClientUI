<div class="platform-control">
  <mat-select class="platform-dropdown"
    (selectionChange)="onValueChange($event)"
    [value]="selectedValue()"
    panelClass="platform-dropdown"
    hideSingleSelectionIndicator>
    <mat-select-trigger>
      @if (selectedValue()==='pc') {
        <mat-icon fontSet="mdi" fontIcon="mdi-microsoft-windows"></mat-icon>
      }
      @if (selectedValue()==='ps4us' || selectedValue()==='ps4eu') {
        <mat-icon fontSet="mdi" fontIcon="mdi-sony-playstation"></mat-icon>
      }
      <span>{{selectedValue() | uppercase}}</span>
    </mat-select-trigger>
    <mat-option value="pc">
      <mat-icon fontSet="mdi" fontIcon="mdi-microsoft-windows"></mat-icon>PC
    </mat-option>
    <mat-option value="ps4us">
      <mat-icon fontSet="mdi" fontIcon="mdi-sony-playstation"></mat-icon>PS4-US
    </mat-option>
    <mat-option value="ps4eu">
      <mat-icon fontSet="mdi" fontIcon="mdi-sony-playstation"></mat-icon>PS4-EU
    </mat-option>
  </mat-select>
</div>
