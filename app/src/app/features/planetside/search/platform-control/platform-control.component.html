<div class="flex items-center h-full">
  <mat-select
    #platformControl
    class="h-full"
    (selectionChange)="onValueChange($event)"
    [value]="selectedValue()"
    panelClass="platform-dropdown"
    [panelWidth]="null"
    aria-label="Platform"
    hideSingleSelectionIndicator>
    <mat-select-trigger class="flex justify-center items-center">
      <mat-icon fontSet="mdi" [fontIcon]="platformControl.value.icon" class="sm-icon"></mat-icon><span class="platform-control_name ml-2">{{ platformControl.value.name }}</span>
    </mat-select-trigger>
    @for (platform of platforms; track platform.id) {
      <mat-option [value]="platform">
        <mat-icon fontSet="mdi" [fontIcon]="platform.icon" class="sm-icon mr-2"></mat-icon>{{platform.name}}
      </mat-option>
    }
  </mat-select>
</div>
