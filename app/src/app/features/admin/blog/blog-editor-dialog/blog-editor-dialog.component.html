<h2 mat-dialog-title>{{ isNew ? 'New Post' : 'Edit Post' }}</h2>

<mat-dialog-content>
  @if (isLoading || isSaving) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
  <vw-error-message [message]="errorMessage"></vw-error-message>

  <mat-form-field class="blog-editor-field">
    <mat-label>Title</mat-label>
    <input matInput name="title" required [(ngModel)]="title" [disabled]="isLoading || isSaving">
    <mat-error>A title is required</mat-error>
  </mat-form-field>

  <mat-tab-group class="blog-editor-tabs" animationDuration="0ms" mat-stretch-tabs="false"
                 [selectedIndex]="selectedTab" (selectedIndexChange)="onTabChange($event)">
    <mat-tab label="Write">
      <mat-form-field class="blog-editor-field">
        <mat-label>Content (Markdown)</mat-label>
        <textarea matInput name="markdownContent" class="blog-editor-markdown" rows="20"
                  [(ngModel)]="markdownContent" [disabled]="isLoading || isSaving"></textarea>
      </mat-form-field>
    </mat-tab>
    <mat-tab label="Preview">
      @if (previewHtml) {
        <div class="blog-editor-preview" [innerHTML]="previewHtml"></div>
      } @else {
        <div class="blog-editor-preview blog-editor-preview-empty">Nothing to preview</div>
      }
    </mat-tab>
  </mat-tab-group>
</mat-dialog-content>

<mat-dialog-actions class="blog-editor-actions">
  @if (!isNew) {
    <button mat-raised-button color="warn" [disabled]="isLoading || isSaving" (click)="onDelete()">Delete</button>
  }
  <span class="blog-editor-spacer"></span>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="!canSave" (click)="onSave()">Save</button>
</mat-dialog-actions>
