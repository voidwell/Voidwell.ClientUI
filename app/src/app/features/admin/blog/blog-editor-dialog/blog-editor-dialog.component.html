<div>
  <vw-error-message [message]="errorMessage"></vw-error-message>
  <div>
    <div>
      <mat-form-field class="large-width">
        <input matInput [(ngModel)]="form.title" placeholder="Title">
      </mat-form-field>
      <mat-form-field class="large-width">
        <textarea matInput [(ngModel)]="form.markdownContent"></textarea>
      </mat-form-field>
    </div>
    <br /><br />
    <div class="dialog-action-footer">
      <button mat-raised-button (click)="closeDialog()">Close</button>
      <div class="pull-right">
        <button mat-raised-button (click)="onSaveBlogPost()">Save</button>
        @if (form.id) {
          <button mat-raised-button color="warn" (click)="onDeleteBlogPost()">Delete</button>
        }
      </div>
    </div>
  </div>
</div>
