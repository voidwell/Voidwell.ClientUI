<mat-card class="stat-card mb-4">
  <mat-card-title>Admin</mat-card-title>
  <mat-card-content>
    <p class="stat-hint m-0 mb-3.5">The areas your account can manage.</p>
    <div class="tiles">
      @for (section of sections(); track section.path) {
        <a class="tile" [routerLink]="'/admin/' + section.path">
          <strong>{{ section.display }}</strong>
          <span>{{ section.description }}</span>
        </a>
      } @empty {
        <p class="stat-hint m-0">Your account has no admin areas yet.</p>
      }
    </div>
  </mat-card-content>
</mat-card>
