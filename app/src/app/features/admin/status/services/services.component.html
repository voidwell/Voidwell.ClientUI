<div class="content-container">
  <h3>Planetside</h3>
  <vw-loader [loading]="isLoading"></vw-loader>
  @if (errorMessage) {
    <vw-error-card></vw-error-card>
  } @else {
    @for (group of serviceGroups; track group.platform.id) {
      <vw-platform-section [platform]="group.platform" [count]="group.items.length">
        @for (service of group.items; track service) {
          <div>
            <mat-card>
              <mat-card-header>
                <mat-card-title>
                  <mat-slide-toggle class="pull-right"
                    [checked]="service.isEnabled"
                    [disabled]="service.isLoading"
                    (change)="onServiceUpdate(service, $event)">
                    <span>{{service.name}}</span>
                  </mat-slide-toggle>
                </mat-card-title>
              </mat-card-header>
              @if (service.details || service.errorMessage) {
                <mat-card-content class="layout-padding">
                  <vw-error-message [message]="service.errorMessage"></vw-error-message>
                  @if (service.details) {
                    <div>
                      <pre>{{service.details | json}}</pre>
                    </div>
                  }
                </mat-card-content>
              }
            </mat-card>
          </div>
        }
      </vw-platform-section>
    }
  }
</div>
