<vw-loader [loading]="isLoading"></vw-loader>
@if (errorMessage) {
  <vw-error-card></vw-error-card>
} @else {
  @for (group of serviceGroups; track group.platform.id) {
    <vw-platform-section [platform]="group.platform" [count]="group.items.length">
      <mat-card class="stat-card mb-4">
        <ul class="services">
          @for (service of group.items; track service) {
            <li>
              <div class="service">
                <span class="name">{{ service.name }}</span>
                @if (service.details) {
                  <button type="button" class="stat-ghost" [attr.aria-expanded]="open().has(key(service))" (click)="toggleDetails(service)">Details</button>
                }
                <mat-slide-toggle
                  [checked]="service.isEnabled"
                  [disabled]="service.isLoading"
                  [attr.aria-label]="service.name"
                  (change)="onServiceUpdate(service, $event)"></mat-slide-toggle>
              </div>
              <vw-error-message [message]="service.errorMessage"></vw-error-message>
              @if (service.details && open().has(key(service))) {
                <pre class="details">{{ service.details | json }}</pre>
              }
            </li>
          }
        </ul>
      </mat-card>
    </vw-platform-section>
  }
}
