<div class="content-container">
  <h3>Planetside</h3>
  <vw-loader variant="table" [rows]="8" [loading]="isLoading()"></vw-loader>
  @if (hasError()) {
    <vw-error-card></vw-error-card>
  } @else if (!isLoading()) {
    <div class="table-filter px-13 py-0 text-right">
      <mat-form-field>
        <input matInput #filterInput (input)="filter.set(filterInput.value)" placeholder="Filter stores">
      </mat-form-field>
    </div>

    @for (group of groups(); track group.platform.id) {
      <vw-platform-section [platform]="group.platform" [count]="group.items.length">
        <mat-table [dataSource]="group.items" class="striped">
          <ng-container matColumnDef="storeName">
            <mat-header-cell *matHeaderCellDef>Store Name</mat-header-cell>
            <mat-cell *matCellDef="let store">{{store.storeName}}</mat-cell>
          </ng-container>

          <ng-container matColumnDef="updateInterval">
            <mat-header-cell *matHeaderCellDef>Update Interval</mat-header-cell>
            <mat-cell *matCellDef="let store">{{store.updateInterval}}</mat-cell>
          </ng-container>

          <ng-container matColumnDef="lastUpdated">
            <mat-header-cell *matHeaderCellDef>Last Updated</mat-header-cell>
            <mat-cell *matCellDef="let store">{{store.lastUpdated | date:'dd MMM yyyy HH:mm'}}</mat-cell>
          </ng-container>

          <ng-container matColumnDef="refreshButton">
            <mat-header-cell *matHeaderCellDef></mat-header-cell>
            <mat-cell *matCellDef="let store">
              <button mat-raised-button (click)="onStoreRefresh(store)" [disabled]="store.isLoading">Refresh</button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: columns;"></mat-row>
        </mat-table>
      </vw-platform-section>
    }
  }
</div>
