<div style="display: flex; justify-content: center">
  <div class="w-full">
    <vw-loader variant="cards" [rows]="3" [loading]="isLoading"></vw-loader>
    @if (errorMessage) {
      <vw-error-card></vw-error-card>
    }
    @if (!isLoading && !errorMessage) {
      <div class="blog-card-list">
        @for (blogPost of blogPosts; track blogPost) {
          <vw-blog-card [post]="blogPost"></vw-blog-card>
        }
      </div>
    }
  </div>
</div>
