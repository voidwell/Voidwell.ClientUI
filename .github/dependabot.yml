version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Angular's compiler-cli pins TypeScript to a single minor (currently >=6.0 <6.1);
      # bump it by hand when Angular supports the next one.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "angular-eslint"
          - "zone.js"
          - "typescript"
      ngrx:
        patterns:
          - "@ngrx/*"
      lint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
      test:
        patterns:
          - "vitest"
          - "jsdom"

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Odd-numbered Node releases never become LTS; bump the Node major by hand to an LTS line.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
